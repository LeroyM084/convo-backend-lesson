info:
  name: Create Conversation
  type: http
  seq: 3

http:
  method: POST
  url: "http://localhost:4000/conversation"
  auth: inherit

headers:
  Authorization: "Bearer {{access_token}}"
  Content-Type: application/json

body:
  json:
    title: My First Conversation

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

assertions:
  - name: Create Conversation - Status is 200
    script: expect(res.getStatus()).to.equal(200);
  - name: Create Conversation - Has id
    script: expect(res.getBody()).to.have.property("id");
  - name: Create Conversation - Title matches
    script: expect(res.getBody().title).to.equal("My First Conversation");
