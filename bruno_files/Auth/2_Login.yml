info:
  name: Login
  type: http
  seq: 2

http:
  method: POST
  url: "http://localhost:4000/auth/login"
  auth: inherit

headers:
  Content-Type: application/json

body:
  json:
    email: testuser@example.com
    password: "TestPassword123!"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

script:
  post-response: |
    if (res.getStatus() === 200) {
      const body = res.getBody();
      if (body.acces_token) {
        bru.setEnvVar("access_token", body.acces_token);
      }
      if (body.refresh_token) {
        bru.setEnvVar("refresh_token", body.refresh_token);
      }
    }

assertions:
  - name: Login - Status is 200
    script: expect(res.getStatus()).to.equal(200);
  - name: Login - Has access_token
    script: expect(res.getBody()).to.have.property("acces_token");
  - name: Login - Has refresh_token
    script: expect(res.getBody()).to.have.property("refresh_token");
